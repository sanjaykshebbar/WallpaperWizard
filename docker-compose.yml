version: '3.8'

services:
  adboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adboard-kiosk
    ports:
      - "8080:3000"
    volumes:
      - adboard-data:/app/data
    restart: unless-stopped
    environment:
      - NODE_ENV=production

volumes:
  adboard-data:
    driver: local
